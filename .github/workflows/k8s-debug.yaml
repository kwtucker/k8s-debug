# k8s-debug.yaml — build, verify, and publish the debug image.
# Simpler than workspace-image.yaml by design: amd64-only v1, no Mason sync
# check (no LSPs in this image), basic verify.sh gate before push.
name: k8s-debug

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "config/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/k8s-debug.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kwtucker/k8s-debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Versioned tag comes from the Makefile TAG so git tags and image tags
      # stay in sync. Bump both together per release.
      - name: Build (local, amd64)
        run: |
          make build
          make test

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:v0.1.2
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
